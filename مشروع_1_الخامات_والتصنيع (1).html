<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مشروع 1 — الخامات والتصنيع</title><style>

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:16px}h1{font-size:28px;margin:0 0 5px;color:var(--silver)!important}h2{font-size:20px;margin:0 0 10px;color:var(--ink)!important}h3{font-size:16px;margin:0 0 9px;color:var(--ink)!important}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:8px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink)!important}th{background:#bcbcbc;color:var(--ink)!important;font-size:13px;font-weight:800}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#c7c7c7;color:var(--ink)!important;font-size:11px}.badge.ok{background:#b9c1b9;color:#173017!important}.badge.bad{background:#c9adad;color:#5a1010!important}.badge.info{background:#b9c2ca;color:#102f45!important}

.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalHead h2{margin:0;color:var(--ink)!important}.line{display:grid;grid-template-columns:2.3fr 1fr 1fr 1fr auto;gap:7px;align-items:center;margin:7px 0}.lineHead{font-weight:800;color:var(--ink)!important;background:#bcbcbc;border:1px solid #999;border-radius:8px;padding:7px;margin-bottom:6px}

@media(max-width:680px){.app{display:block}.sidebar{position:static;width:auto;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{margin-right:0;padding:12px}.grid,.form{grid-template-columns:1fr}.span2,.span4{grid-column:span 1}.line{grid-template-columns:1fr}.top{flex-direction:column}}

.sidebar{background:#626262!important}

.brand .factoryName{color:#d00000!important}
</style></head><body><script>
const PROJECT="P1";
const STOREKEY="BM_FACTORY_FINAL_V29_"+PROJECT;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=()=>Date.now().toString(36)+"_"+Math.random().toString(36).slice(2);
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>(Number(n)||0).toLocaleString("ar-EG",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

let MEM=null;
let SERVER_BASE=null, SERVER_REVISION=0;
const NETWORK_ENABLED = (location.protocol === "http:" || location.protocol === "https:");
function cloneObj(v){try{return JSON.parse(JSON.stringify(v));}catch(e){return v}}
function jsonEq(a,b){try{return JSON.stringify(a)===JSON.stringify(b)}catch(e){return false}}
function httpSync(method,url,body){
  const x=new XMLHttpRequest();
  x.open(method,url,false);
  x.setRequestHeader('Content-Type','application/json;charset=UTF-8');
  x.send(body===undefined?null:JSON.stringify(body));
  if(x.status>=200 && x.status<300) return x.responseText;
  throw new Error('HTTP '+x.status);
}
function mergeNetworkState(base, local, latest){
  const out=cloneObj(latest||local);
  for(const k of ['company','settings']) if(!jsonEq(base?.[k],local?.[k])) out[k]=cloneObj(local[k]);
  out.next=out.next||{};
  for(const k of new Set([...Object.keys(base?.next||{}),...Object.keys(local?.next||{}),...Object.keys(out.next||{})])){
    const bv=Number(base?.next?.[k]||0), lv=Number(local?.next?.[k]||0), sv=Number(out.next?.[k]||0);
    out.next[k]=Math.max(bv,lv,sv);
  }
  out.r=out.r||{};
  for(const key of Object.keys(local?.r||{})){
    const bArr=Array.isArray(base?.r?.[key])?base.r[key]:[];
    const lArr=Array.isArray(local?.r?.[key])?local.r[key]:[];
    let oArr=Array.isArray(out?.r?.[key])?out.r[key]:[];
    const bMap=new Map(bArr.filter(x=>x&&x.id!=null).map(x=>[String(x.id),JSON.stringify(x)]));
    const pos=new Map(oArr.filter(x=>x&&x.id!=null).map((x,i)=>[String(x.id),i]));
    for(const item of lArr){
      if(!item || item.id==null) continue;
      const id=String(item.id), sig=JSON.stringify(item);
      if(!bMap.has(id) || bMap.get(id)!==sig){
        if(pos.has(id)) oArr[pos.get(id)]=cloneObj(item);
        else {pos.set(id,oArr.length);oArr.push(cloneObj(item));}
      }
    }
    out.r[key]=oArr;
  }
  for(const key of ['moves','audit']){
    const bArr=Array.isArray(base?.[key])?base[key]:[], lArr=Array.isArray(local?.[key])?local[key]:[];
    let oArr=Array.isArray(out?.[key])?out[key]:[];
    const bMap=new Map(bArr.filter(x=>x&&x.id!=null).map(x=>[String(x.id),JSON.stringify(x)]));
    const pos=new Map(oArr.filter(x=>x&&x.id!=null).map((x,i)=>[String(x.id),i]));
    for(const item of lArr){
      if(!item || item.id==null) continue;
      const id=String(item.id), sig=JSON.stringify(item);
      if(!bMap.has(id) || bMap.get(id)!==sig){
        if(pos.has(id)) oArr[pos.get(id)]=cloneObj(item); else {pos.set(id,oArr.length);oArr.push(cloneObj(item));}
      }
    }
    out[key]=oArr;
  }
  return out;
}
function loadState(){
  if(NETWORK_ENABLED){
    try{
      const d=JSON.parse(httpSync('GET','/api/state?project='+encodeURIComponent(PROJECT)));
      SERVER_BASE=cloneObj(d.state); SERVER_REVISION=Number(d.revision||0); return d.state;
    }catch(e){ /* fallback below */ }
  }
  try{const raw=window.localStorage.getItem(STOREKEY);if(raw)return JSON.parse(raw);}catch(e){}
  return MEM || seed();
}
function saveState(){
  if(NETWORK_ENABLED){
    try{
      const latest=JSON.parse(httpSync('GET','/api/state?project='+encodeURIComponent(PROJECT)));
      const merged=mergeNetworkState(SERVER_BASE,DB,latest.state);
      const d=JSON.parse(httpSync('POST','/api/state',{project:PROJECT,state:merged,baseRevision:Number(latest.revision||0)}));
      DB=merged; SERVER_BASE=cloneObj(merged); SERVER_REVISION=Number(d.revision||0); return;
    }catch(e){ alert('تعذر الاتصال بالخادم المركزي. لم يتم حفظ التعديل.'); throw e; }
  }
  try{window.localStorage.setItem(STOREKEY,JSON.stringify(DB));}
  catch(e){MEM=DB;}
}
function refreshFromServer(){
  if(!NETWORK_ENABLED){alert('البرنامج يعمل في الوضع المحلي.');return;}
  try{
    const d=JSON.parse(httpSync('GET','/api/state?project='+encodeURIComponent(PROJECT)));
    DB=d.state; SERVER_BASE=cloneObj(DB); SERVER_REVISION=Number(d.revision||0);
    shell();
    alert('تم تحديث البيانات من قاعدة البيانات المركزية.');
  }catch(e){alert('تعذر الاتصال بالخادم المركزي. تأكد من تشغيل السيرفر.');}
}

function seed(){
  if(PROJECT==="P1"){
    return {company:{name:"طيبة",currency:"جنيه"},settings:{negativeStock:false},next:{},moves:[],r:{
      suppliers:[],materials:[],units:[],warehouses:[],purchases:[],receipts:[],issues:[],productionOrders:[],outputs:[]
    }};
  }
  return {company:{name:"طيبة",currency:"جنيه"},settings:{negativeStock:false},next:{},moves:[],r:{
    products:[],units:[],warehouses:[],branches:[],customers:[],receipts:[],branchInvoices:[],salesInvoices:[],returns:[],customerReceipts:[]
  }};
}
let DB=loadState(); DB.company=DB.company||{name:"طيبة",currency:"جنيه"}; if(!DB.company.name || DB.company.name==="مصنعنا") DB.company.name="طيبة"; DB.company.currency=DB.company.currency||"جنيه";
function rows(t){return DB.r[t]||[]}
function active(t){return rows(t).filter(x=>x.active!==false)}
function get(t,id){return rows(t).find(x=>x.id===id)}
function seq(prefix){DB.next[prefix]=(DB.next[prefix]||0)+1;saveState();return prefix+"-"+String(DB.next[prefix]).padStart(6,"0")}
function itemTable(){return PROJECT==="P1"?"materials":"products"}
function itemName(id){const x=get(itemTable(),id);return x?.name||x?.code||"—"}
function stock(id,wh){return DB.moves.filter(m=>m.itemId===id&&(!wh||m.whId===wh)).reduce((s,m)=>s+Number(m.qty||0),0)}
function addMove(x){DB.moves.push({id:uid(),date:today(),...x})}
function reverseDoc(docId){
  DB.moves.filter(m=>m.docId===docId&&!m.reversed).forEach(m=>{addMove({itemId:m.itemId,whId:m.whId,qty:-m.qty,cost:m.cost,type:"REVERSAL",docNo:m.docNo+"/R",docId});m.reversed=true})
}
function badge(s){return `<span class="badge ${s==="APPROVED"?"ok":s==="CANCELLED"?"bad":""}">${s==="DRAFT"?"مسودة":s==="APPROVED"?"معتمد":"ملغى"}</span>`}
function typeText(t){return ({PURCHASE_RECEIPT:"استلام خامات",ISSUE_TO_PRODUCTION:"صرف للتصنيع",PRODUCTION_OUTPUT:"إنتاج",BRANCH_DISTRIBUTION:"توزيع فرع",CUSTOMER_SALE:"بيع عميل",CUSTOMER_RETURN:"مرتجع عميل",BRANCH_RETURN:"مرتجع فرع",REVERSAL:"عكس حركة"})[t]||t}
function modal(title,html){$("#modalTitle").textContent=title;$("#modalBody").innerHTML=html;$("#modalBack").style.display="flex"}
function closeModal(){$("#modalBack").style.display="none"}
const openModal=modal;
const writeState=saveState;

/* ===== V21 Administrative controls ===== */
const ADMIN_KEY="BM_FACTORY_ADMIN_SESSION_"+PROJECT;
let currentUser=null;
const ADMIN_PERMS=[
  "home","suppliers","materials","warehouses","purchases","receipts","issues","production","outputs",
  "products","branches","customers","branchInvoices","sales","returns","customerReceipts","customerStatement","branchStatement","productCard",
  "stock","reports","settings","admin","create","edit","approve","cancel","print","backup"
];
const PERM_LABELS={
  home:"الرئيسية",suppliers:"الموردون",materials:"الخامات",warehouses:"المخازن",purchases:"المشتريات",receipts:"الاستلام",issues:"صرف الخامات",
  production:"أوامر التصنيع",outputs:"تسجيل الإنتاج",products:"المنتجات",branches:"الفروع",customers:"العملاء",branchInvoices:"توزيع الفروع",
  sales:"مبيعات العملاء",returns:"المرتجعات",customerReceipts:"إيصالات القبض",customerStatement:"كشف حساب عميل",branchStatement:"كشف حساب فرع",
  productCard:"بطاقة حركة المنتج",stock:"المخزون",reports:"التقارير",settings:"بيانات المصنع",admin:"الإدارة والصلاحيات",
  create:"إضافة مستند/بيان",edit:"تعديل البيانات الأساسية",approve:"اعتماد المستندات",cancel:"إلغاء المستندات",print:"الطباعة",backup:"النسخ الاحتياطي"
};
const ROLE_DEFAULTS={
  ADMIN:ADMIN_PERMS.slice(),
  PURCHASES:["home","suppliers","materials","warehouses","purchases","receipts","stock","reports","create","edit","print","backup"],
  STORE:["home","materials","products","warehouses","receipts","issues","returns","stock","reports","create","edit","print"],
  PRODUCTION:["home","materials","warehouses","issues","production","outputs","stock","reports","create","edit","approve","cancel","print"],
  SALES:["home","products","warehouses","branches","customers","branchInvoices","sales","returns","customerReceipts","customerStatement","branchStatement","stock","reports","create","edit","print"],
  ACCOUNTS:["home","customers","branches","customerReceipts","customerStatement","branchStatement","reports","stock","print"],
  OPERATIONS:["home","purchases","receipts","issues","production","outputs","branchInvoices","sales","returns","create","edit","approve","print"]
};
function projectPerms(){
  const p1=["home","suppliers","materials","warehouses","purchases","receipts","issues","production","outputs","stock","reports","settings","admin","create","edit","approve","cancel","print","backup"];
  const p2=["home","products","warehouses","branches","customers","receipts","branchInvoices","sales","returns","customerReceipts","customerStatement","branchStatement","stock","productCard","reports","settings","admin","create","edit","approve","cancel","print","backup"];
  return PROJECT==="P1"?p1:p2;
}
function allowedPerms(list){const valid=new Set(projectPerms());return [...new Set((list||[]).filter(x=>valid.has(x)))];}
function initAdminState(){
  DB.r.users=Array.isArray(DB.r.users)?DB.r.users:[];
  DB.r.roles=Array.isArray(DB.r.roles)?DB.r.roles:[];
  const seeds=[
    ["ADMIN","مدير","صلاحيات كاملة"],["PURCHASES","المشتريات","الموردون والمشتريات والاستلام"],["STORE","المخازن","المخازن والحركات"],["PRODUCTION","الإنتاج","أوامر وصرف وإنتاج"],["SALES","المبيعات والتوزيع","الفروع والعملاء والمبيعات والمرتجعات"],["ACCOUNTS","الحسابات","المقبوضات وكشوف الحساب والتقارير"],["OPERATIONS","تشغيل","شاشات التشغيل المطلوبة فقط"]
  ];
  for(const [code,name,desc] of seeds){
    if(!DB.r.roles.some(r=>r.code===code)) DB.r.roles.push({id:uid(),code,name,description:desc,permissions:allowedPerms(ROLE_DEFAULTS[code]),active:true,system:true});
  }
  // دعم صلاحيات الإصدارات السابقة: يمكن تخزينها كمصفوفة أو كقاموس.
  let adminRole=DB.r.roles.find(r=>r.code==="ADMIN");
  if(!adminRole){adminRole={id:uid(),code:"ADMIN",name:"مدير",description:"صلاحيات كاملة",permissions:allowedPerms(ROLE_DEFAULTS.ADMIN),active:true,system:true};DB.r.roles.push(adminRole);}
  adminRole.name="مدير"; adminRole.description="صلاحيات كاملة"; adminRole.permissions=allowedPerms(ROLE_DEFAULTS.ADMIN); adminRole.active=true; adminRole.system=true;
  let manager=DB.r.users.find(u=>String(u.username||"").trim().toLowerCase()==="مدير" || String(u.username||"").trim().toLowerCase()==="admin");
  if(!manager){manager={id:uid(),username:"مدير",name:"مدير",password:"1020",roleId:adminRole.id,active:true,createdAt:new Date().toISOString()};DB.r.users.push(manager);}
  else {const wasAdmin=String(manager.username||"").trim().toLowerCase()==="admin"; manager.username="مدير"; manager.name="مدير"; if(wasAdmin || !manager.password || manager.password==="1234") manager.password="1020"; manager.roleId=adminRole.id; manager.active=true;}
  DB.r.users = DB.r.users.filter((u,i,a)=>i===a.findIndex(x=>x.id===u.id) && String(u.username||"").trim().toLowerCase()!=="admin");
  const defaultCodes=["PURCHASES","STORE","PRODUCTION","SALES","ACCOUNTS","OPERATIONS"];
  for(const code of defaultCodes){const rr=DB.r.roles.find(r=>r.code===code);if(rr){rr.permissions=allowedPerms(ROLE_DEFAULTS[code]);rr.active=true;}}
  const opsRole=DB.r.roles.find(r=>r.code==="OPERATIONS");
  if(opsRole){opsRole.name="تشغيل";opsRole.description="شاشات التشغيل المطلوبة فقط";opsRole.permissions=allowedPerms(ROLE_DEFAULTS.OPERATIONS);opsRole.active=true;}
  // migrate old audit entries to the V21 shape without losing information
  DB.audit=(DB.audit||[]).map(x=>({...x,userName:x.userName||x.createdBy||"النظام",username:x.username||"",timestamp:x.timestamp||x.date||new Date().toISOString(),project:PROJECT}));
  saveState();
}
function roleOfUser(u=currentUser){return u?get("roles",u.roleId):null}
function hasPerm(role,p){
  if(!currentUser) return false;
  // حساب المدير (مدير / admin) يتجاوز نظام الصلاحيات بالكامل ويملك كل أوامر المشروع.
  // هذا يمنع أي بيانات صلاحيات قديمة من تعطيل أوامر المدير.
  const uname=String(currentUser.username||currentUser.name||"").trim().toLowerCase();
  const isManager = uname==="مدير" || uname==="admin" || role?.code==="ADMIN";

function normSearch(v){return String(v??"").toLowerCase().trim().replace(/\s+/g," ")}
function enhanceItemSelectors(scope=document){
  $$(".itemSel",scope).forEach(sel=>{
    if(sel.dataset.searchEnhanced==="1")return;
    sel.dataset.searchEnhanced="1";
    const opts=[...sel.options].map(o=>({value:o.value,label:o.textContent.trim()}));
    const listId="itemList_"+uid();
    const wrap=document.createElement("div"); wrap.className="search-select-wrap";
    const input=document.createElement("input");
    input.className="itemSearch"; input.type="text"; input.setAttribute("list",listId);
    input.placeholder="اكتب كود أو اسم للبحث..."; input.autocomplete="off";
    input.setAttribute("aria-label","البحث عن الصنف");
    const dl=document.createElement("datalist"); dl.id=listId;
    dl.innerHTML=opts.map(o=>`<option value="${esc(o.label)}"></option>`).join("");
    const current=opts.find(o=>String(o.value)===String(sel.value));
    input.value=current?.label||"";
    sel.parentNode.insertBefore(wrap,sel); wrap.appendChild(input); wrap.appendChild(dl); wrap.appendChild(sel);
    const sync=()=>{const o=opts.find(x=>String(x.value)===String(sel.value)); if(o&&input.value!==o.label)input.value=o.label;};
    input.addEventListener("input",()=>{
      const q=normSearch(input.value);
      if(!q){sel.value=opts[0]?.value||""; sel.dispatchEvent(new Event("change",{bubbles:true})); return;}
      const exact=opts.find(o=>normSearch(o.label)===q);
      const contains=opts.filter(o=>normSearch(o.label).includes(q));
      const hit=exact|| (contains.length===1?contains[0]:null);
      if(hit && String(sel.value)!==String(hit.value)){sel.value=hit.value; sel.dispatchEvent(new Event("change",{bubbles:true}));}
    });
    input.addEventListener("change",()=>{
      const q=normSearch(input.value);
      const exact=opts.find(o=>normSearch(o.label)===q);
      const contains=opts.filter(o=>normSearch(o.label).includes(q));
      const hit=exact||contains[0];
      if(hit){sel.value=hit.value; sel.dispatchEvent(new Event("change",{bubbles:true}));} else sync();
    });
    sel.addEventListener("change",sync);
  });
}

function lineEditor(table,itemKind,buildHeader,buildSave){
  if(!guard("create"))return;
  let lines=[];
  const itemTableName=itemKind==="material"?"materials":"products";
  const itemTitle=itemKind==="material"?"خامة":"منتج";
  const addHint=`<div id="lineHint" class="alert" style="display:none"></div>`;
  modal(buildHeader.title,buildHeader.head+addHint+`<div class="line lineHead"><div>${itemTitle}</div><div>الكمية</div><div>${itemKind==="material"?"التكلفة":"السعر"}</div><div>الإجمالي</div><div>حذف</div></div><div id="lineWrap" class="lines"></div><div class="toolbar"><button class="btn" id="addLine" type="button">+ إضافة ${itemTitle}</button><button class="btn primary" id="saveDoc" type="button">حفظ مسودة</button></div>`);
  const draw=()=>{
    const a=active(itemTableName);
    $("#lineWrap").innerHTML=lines.map((l,i)=>buildHeader.line(l,i)).join("")||`<div class="empty">لم تتم إضافة بنود بعد.</div>`;
    $$(".itemSel").forEach(e=>e.onchange=()=>{
      const l=lines[+e.dataset.i];
      l.itemId=e.value;
      const it=get(itemTableName,l.itemId);
      if(it){
        l.price=Number(it.defaultSalesPrice||it.standardCost||0);
        l.cost=Number(it.standardCost||0);
      }
      draw();
    });
    $$(".qty").forEach(e=>e.oninput=()=>{lines[+e.dataset.i].qty=Number(e.value||0);const l=lines[+e.dataset.i];const t=$(".lineTotal",e.parentElement);if(t)t.textContent=money(l.qty*(Number(l.price??l.cost??0)));});
    $$(".price").forEach(e=>e.oninput=()=>{lines[+e.dataset.i].price=Number(e.value||0);const l=lines[+e.dataset.i];const t=$(".lineTotal",e.parentElement);if(t)t.textContent=money(l.qty*(Number(l.price??l.cost??0)));});
    $$(".cost").forEach(e=>e.oninput=()=>{lines[+e.dataset.i].cost=Number(e.value||0);const l=lines[+e.dataset.i];const t=$(".lineTotal",e.parentElement);if(t)t.textContent=money(l.qty*(Number(l.price??l.cost??0)));});
    $$(".cond").forEach(e=>e.onchange=()=>lines[+e.dataset.i].condition=e.value);
    $$(".del").forEach(e=>e.onclick=()=>{lines.splice(+e.dataset.i,1);draw()});
    if(!a.length){
      $("#lineHint").style.display="block";
      $("#lineHint").innerHTML=`لا توجد ${itemTitle}ات مسجلة حاليًا. أضف ${itemTitle} أولًا من شاشة ${itemKind==="material"?"الخامات":"المنتجات"} ثم ارجع للمستند.`;
      $("#addLine").disabled=true;
      $("#addLine").title=`أضف ${itemTitle} أولًا`;
    }else{
      $("#lineHint").style.display="none";
      $("#addLine").disabled=false;
      $("#addLine").title="";
    }
  };
  $("#addLine").onclick=()=>{
    const a=active(itemTableName), x=a[0];
    if(!x){draw();return alert(`لا توجد ${itemTitle}ات مسجلة. انتقل إلى شاشة ${itemKind==="material"?"الخامات":"المنتجات"} واضغط + جديد أولًا.`)}
    lines.push({itemId:x.id,qty:1,price:x.defaultSalesPrice||x.standardCost||0,cost:x.standardCost||0,condition:"SALEABLE"});
    draw();
  };
  $("#saveDoc").onclick=()=>{
    if(!lines.length)return alert("أضف بندًا واحدًا على الأقل.");
    if(lines.some(l=>!l.itemId))return alert(`اختر ${itemTitle}ًا لكل بند.`);
    if(lines.some(l=>Number(l.qty||0)<=0))return alert("يجب أن تكون الكمية أكبر من صفر.");
    buildSave(lines)
  };
  draw();
}

function invoiceP2(table,prefix,partyTable,partyLabel,moveType,title){
  let lines=[];modal(title,`<div class="form"><div class="field"><label>${partyLabel}</label><select id="party">${active(partyTable).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>المخزن</label><select id="wh">${active("warehouses").map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>التاريخ</label><input id="dt" type="date" value="${today()}"></div></div><div id="lw" class="lines"></div><div class="toolbar"><button class="btn" id="add">+ إضافة منتج</button><button class="btn primary" id="sv">حفظ</button></div>`);
  const draw=()=>{$("#lw").innerHTML=lines.map((l,i)=>`<div class="line"><select class="itemSel" data-i="${i}">${active("products").map(x=>`<option value="${x.id}" ${x.id===l.itemId?"selected":""}>${esc(x.name)}</option>`).join("")}</select><input class="qty" data-i="${i}" type="number" step="0.01" value="${l.qty}"><input class="price" data-i="${i}" type="number" step="0.01" value="${l.price}"><div>الرصيد ${money(stock(l.itemId,$("#wh").value))}</div><button class="btn danger del" data-i="${i}">×</button></div>`).join("")||`<div class="empty">أضف منتجًا.</div>`;$$(".itemSel").forEach(e=>e.onchange=()=>lines[+e.dataset.i].itemId=e.value);$$(".qty").forEach(e=>e.oninput=()=>{lines[+e.dataset.i].qty=Number(e.value||0);const l=lines[+e.dataset.i];const t=$(".lineTotal",e.parentElement);if(t)t.textContent=money(l.qty*(Number(l.price??l.cost??0)));});$$(".price").forEach(e=>e.oninput=()=>{lines[+e.dataset.i].price=Number(e.value||0);const l=lines[+e.dataset.i];const t=$(".lineTotal",e.parentElement);if(t)t.textContent=money(l.qty*(Number(l.price??l.cost??0)));});$$(".del").forEach(e=>e.onclick=()=>{lines.splice(+e.dataset.i,1);draw()})};
  $("#add").onclick=()=>{const p=active("products")[0];if(p)lines.push({itemId:p.id,qty:1,price:p.defaultSalesPrice||0});draw()};
  $("#sv").onclick=()=>{if(!lines.length)return alert("أضف منتجًا.");rows(table).push({id:uid(),no:seq(prefix),date:$("#dt").value,partyId:$("#party").value,whId:$("#wh").value,lines,total:lines.reduce((s,l)=>s+l.qty*l.price,0),status:"DRAFT"});saveState();closeModal();route(table==="branchInvoices"?"branchInvoices":"sales")};
  draw();
}

function parseDelimited(text){
  text=String(text||"").replace(/^\uFEFF/,"");
  const first=text.split(/\r?\n/,1)[0]||"";
  const delim=(first.includes("\t"))?"\t":(first.split(";").length>first.split(",").length?";":",");
  const rows=[]; let row=[], cell="", inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"' && text[i+1]==='"'){cell+='"';i++;} else if(c==='"') inQ=false; else cell+=c; }
    else if(c==='"') inQ=true;
    else if(c===delim){row.push(cell);cell="";}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell="";}
    else if(c!=='\r') cell+=c;
  }
  row.push(cell); if(row.some(x=>String(x).trim()!==""))rows.push(row);
  return rows;
}
function u16(v,o){return v[o]|(v[o+1]<<8)}
function u32(v,o){return (v[o]|(v[o+1]<<8)|(v[o+2]<<16)|(v[o+3]<<24))>>>0}
function findSig(v,sig){for(let i=v.length-4;i>=0;i--)if(u32(v,i)===sig)return i;return -1}
async function inflateRaw(buf){
  const ds=new DecompressionStream("deflate-raw");
  return new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(ds)).arrayBuffer());
}
async function unzipXlsx(arrayBuffer){
  const v=new Uint8Array(arrayBuffer), end=findSig(v,0x06054b50); if(end<0)throw new Error("ملف Excel غير صالح.");

    const comp=v.slice(start,start+csize);
    let data;
    if(method===0)data=comp;
    else if(method===8)data=await inflateRaw(comp);
    else throw new Error("صيغة ضغط Excel غير مدعومة.");
    files[name]=data; p+=46+nlen+elen+clen;
  }

}
function xmlText(node){
  return Array.from(node.getElementsByTagNameNS("*","t")).map(x=>x.textContent||"").join("");
}
function colIndex(ref){
  const m=String(ref||"").match(/^([A-Z]+)\d+$/i); if(!m)return 0;
  let n=0; for(const ch of m[1].toUpperCase())n=n*26+(ch.charCodeAt(0)-64); return n-1;

async function parseXlsx(file){
  const files=await unzipXlsx(await file.arrayBuffer());
  const dec=new TextDecoder("utf-8");
  const shared=[];
  if(files["xl/sharedStrings.xml"]){
    const doc=new DOMParser().parseFromString(dec.decode(files["xl/sharedStrings.xml"]),"application/xml");
    Array.from(doc.getElementsByTagNameNS("*","si")).forEach(si=>shared.push(xmlText(si)));
  }
  let sheetPath="xl/worksheets/sheet1.xml";
  if(files["xl/workbook.xml"] && files["xl/_rels/workbook.xml.rels"]){
    const wb=new DOMParser().parseFromString(dec.decode(files["xl/workbook.xml"]),"application/xml");
    const rels=new DOMParser().parseFromString(dec.decode(files["xl/_rels/workbook.xml.rels"]),"application/xml");
    const sheet=wb.getElementsByTagNameNS("*","sheet")[0];
    const rid=sheet?.getAttribute("r:id") || sheet?.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
    const rel=Array.from(rels.getElementsByTagNameNS("*","Relationship")).find(x=>x.getAttribute("Id")===rid);
    if(rel){
      let target=rel.getAttribute("Target").replace(/^\//,"");
      sheetPath=target.startsWith("xl/")?target:("xl/"+target.replace(/^\.\//,""));
    }
  }
  const xml=files[sheetPath]||files[Object.keys(files).find(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k))];
  if(!xml)throw new Error("لم أجد ورقة البيانات داخل ملف Excel.");
  const doc=new DOMParser().parseFromString(dec.decode(xml),"application/xml");
  const out=[];
  Array.from(doc.getElementsByTagNameNS("*","row")).forEach(rowNode=>{
    const row=[];
    Array.from(rowNode.getElementsByTagNameNS("*","c")).forEach(c=>{
      const idx=colIndex(c.getAttribute("r")); const t=c.getAttribute("t"); let val="";
      if(t==="inlineStr")val=xmlText(c);
      else {const v=c.getElementsByTagNameNS("*","v")[0]; val=v?(v.textContent||""):""; if(t==="s")val=shared[Number(val)]??""; else if(t==="b")val=val==="1"?"TRUE":"FALSE";}
      while(row.length<=idx)row.push(""); row[idx]=val;
    });
    if(row.some(x=>String(x??"").trim()!==""))out.push(row);
  });

}
async function readSpreadsheet(file){
  const name=file.name.toLowerCase();
  if(name.endsWith(".csv")||name.endsWith(".txt"))return parseDelimited(await file.text());
  if(name.endsWith(".xlsx"))return parseXlsx(file);
  throw new Error("اختر ملف Excel بصيغة .xlsx أو ملف CSV.");
}
function firstCol(headers, aliases){
  const hs=headers.map(normHeader); for(const a of aliases){const na=normHeader(a); const i=hs.indexOf(na); if(i>=0)return i;}
  for(const a of aliases){const na=normHeader(a); const i=hs.findIndex(h=>h.includes(na)||na.includes(h)); if(i>=0)return i;}
  return -1;
}
function numVal(v){let s=String(v??"").trim().replace(/,/g,""); if(!s)return 0; const n=Number(s); return Number.isFinite(n)?n:0;}
function autoUnit(unitName){
  const name=String(unitName||"").trim()||"قطعة";
  let x=rows("units").find(u=>String(u.name||"").trim().toLowerCase()===name.toLowerCase());
  if(!x){x={id:uid(),code:("U"+uid().replace(/[^A-Za-z0-9]/g,"").slice(-6)).toUpperCase(),name,active:true};rows("units").push(x)}
  return x.id;
}

function preloadTaibaMaterials(){
  if(PROJECT!=="P1") return;
  DB.settings=DB.settings||{};
  const items=TAIBA_MATERIAL_SNAPSHOT.map(x=>({
    code:String(x.code),
    name:String(x.name||"").trim(),
    unit:String(x.unit||"قطعة").trim()||"قطعة",
    cost:Number(x.cost||0),
    price:0,
    barcode:String(x.barcode||""),
    minimum:0,
    reorder:0
  })).filter(x=>x.code && x.name);
  if(!DB.settings.taibaMaterialsLoaded){
    importRowsIntoMaster("materials",items);
    DB.settings.taibaMaterialsLoaded=true;
    DB.settings.taibaMaterialsSource="خامات.xlsx";
    DB.settings.taibaMaterialsCount=items.length;
    saveState();
    return;
  }
  const present=new Set(rows("materials").map(m=>String(m.code||"").trim().toLowerCase()));
  const missing=items.filter(x=>!present.has(String(x.code).trim().toLowerCase()));
  if(missing.length){
    importRowsIntoMaster("materials",missing);
    DB.settings.taibaMaterialsCount=items.length;
    saveState();
  }
}
function importRowsIntoMaster(table,items){

    const unitId=autoUnit(x.unit), arr=rows(table); let existing=arr.find(r=>String(r.code||"").trim().toLowerCase()===key);
    if(existing){Object.assign(existing,{name:x.name,unitId,barcode:x.barcode||existing.barcode||"",standardCost:x.cost,minimumStock:x.minimum,reorderLevel:x.reorder}); if(table==="products")existing.defaultSalesPrice=x.price; updated++}
    else {const o={id:uid(),active:true,code:x.code,name:x.name,unitId,minimumStock:x.minimum,reorderLevel:x.reorder,standardCost:x.cost,barcode:x.barcode}; if(table==="products")o.defaultSalesPrice=x.price; arr.push(o); added++}
    units++;
  }
  saveState(); return {added,updated,units};
}

    try{const raw=await readSpreadsheet(f); if(raw.length<2)throw new Error("الملف لا يحتوي على صفوف بيانات كافية."); mapped=mapImportRows(table,raw[0],raw.slice(1)); if(!mapped.length)throw new Error("لم أجد بيانات صحيحة. راجع عناوين الأعمدة والكود والاسم."); parsed=raw; $("#importPreview").innerHTML=`<div class="success">تمت قراءة <b>${mapped.length}</b> صنفًا. معاينة أول ${Math.min(8,mapped.length)} صف.</div><table><thead><tr><th>الكود</th><th>الاسم</th><th>الوحدة</th><th>التكلفة</th><th>${table==="products"?"البيع":"الباركود"}</th>${table==="products"?"<th>الباركود</th>":""}</tr></thead><tbody>${mapped.slice(0,8).map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td>${money(x.cost)}</td><td>${table==="products"?money(x.price):esc(x.barcode)}</td>${table==="products"?`<td>${esc(x.barcode)}</td>`:""}</tr>`).join("")}</tbody></table>`; $("#doImport").disabled=false;}catch(err){parsed=null;mapped=null;$("#doImport").disabled=true;$("#importPreview").innerHTML=`<div class="alert">${esc(err.message||String(err))}</div>`}
  };
  $("#doImport").onclick=()=>{if(!mapped?.length)return;const stat=importRowsIntoMaster(table,mapped);closeModal();route(table);alert(`تم الاستيراد بنجاح. إضافات: ${stat.added} — تحديثات: ${stat.updated}.`)};
}

window._bomEdit=id=>bomForm(get("boms",id));
function bomForm(r=null){
  let edit=!!r, lines=rows("bomLines").filter(x=>x.bomId===r?.id);
  openModal(edit?"تعديل تركيبة":"تركيبة منتج جديدة",`<div class="form"><div class="field"><label>اسم المنتج</label><input id="bomProduct" value="${esc(r?.productName||"")}"></div><div class="field"><label>الإصدار</label><input id="bomVer" value="${esc(r?.version||"1")}"></div><div class="field"><label>كمية الإنتاج المرجعية</label><input id="bomQty" type="number" step="0.01" value="${r?.outputQty||1}"></div><div class="field"><label>الحالة</label><select id="bomStatus"><option ${(!r||r.status==="ACTIVE")?"selected":""} value="ACTIVE">نشطة</option><option ${r?.status==="INACTIVE"?"selected":""} value="INACTIVE">موقفة</option></select></div></div><div id="bomLines" class="lines"></div><div class="toolbar"><button class="btn" id="addBL">+ إضافة خامة</button><button class="btn primary" id="saveBL">حفظ</button></div>`);
  const draw=()=>{$("#bomLines").innerHTML=lines.map((l,i)=>`<div class="line"><select class="itemSel" data-i="${i}">${active("materials").map(m=>`<option value="${m.id}" ${m.id===l.materialId?"selected":""}>${esc(m.name)}</option>`).join("")}</select><input class="qty" data-i="${i}" type="number" step="0.001" value="${l.qty}"><div>تكلفة تقديرية</div><div>${money((get("materials",l.materialId)?.standardCost||0)*l.qty)}</div><button class="btn danger del" data-i="${i}">×</button></div>`).join("")||`<div class="empty">أضف خامة.</div>`;$$('.itemSel').forEach(e=>e.onchange=()=>lines[+e.dataset.i].materialId=e.value);$$('.qty').forEach(e=>e.oninput=()=>lines[+e.dataset.i].qty=Number(e.value||0));$$('.del').forEach(e=>e.onclick=()=>{lines.splice(+e.dataset.i,1);draw()})};
  $("#addBL").onclick=()=>{const m=active("materials")[0];if(m){lines.push({materialId:m.id,qty:1});draw()}};
  $("#saveBL").onclick=()=>{if(!$("#bomProduct").value.trim())return alert("اسم المنتج مطلوب.");const bom=edit?r:{id:uid(),no:seq("P1-BOM")};bom.productName=$("#bomProduct").value;bom.version=$("#bomVer").value;bom.outputQty=Number($("#bomQty").value||1);bom.status=$("#bomStatus").value;if(!edit)rows("boms").push(bom);rows("bomLines").filter(x=>x.bomId===bom.id).forEach(x=>x._delete=true);DB.r.bomLines=rows("bomLines").filter(x=>!x._delete);lines.forEach(l=>rows("bomLines").push({id:uid(),bomId:bom.id,materialId:l.materialId,qty:Number(l.qty||0)}));audit(edit?"UPDATE":"CREATE","BOM",bom.id,bom.productName);writeState();closeModal();p1BOM()};
  draw();
}
function p1Costing(){
  const pos=rows("productionOrders"), issues=rows("issues"), outputs=rows("outputs"), extra=rows("costs");
  const data=pos.map(po=>{let mat=0;issues.filter(i=>i.productionOrderId===po.id).forEach(i=>i.lines.forEach(l=>mat+=Number(l.qty||0)*Number(l.cost||0)));let ex=extra.filter(c=>c.productionOrderId===po.id).reduce((s,c)=>s+Number(c.amount||0),0);let out=outputs.filter(o=>o.productionOrderId===po.id).reduce((s,o)=>s+Number(o.qty||0),0);return {po,mat,ex,total:mat+ex,out,cpu:out?(mat+ex)/out:0}});
  const rowsHtml=data.map(x=>`<tr><td>${esc(x.po.no)}</td><td>${esc(x.po.productName)}</td><td>${money(x.mat)}</td><td>${money(x.ex)}</td><td>${money(x.total)}</td><td>${qtyFmt(x.out)}</td><td>${money(x.cpu)}</td><td><button class="btn" onclick="window._addCost('${x.po.id}')">+ تكلفة</button></td></tr>`).join("")||`<tr><td colspan="8" class="empty">لا توجد أوامر تصنيع.</td></tr>`;
  $("#view").innerHTML=`<div class="top"><div><h1>تكلفة التصنيع</h1><div class="muted">حساب تكلفة الخامات + التكاليف الإضافية ÷ الإنتاج الفعلي.</div></div><button class="btn" onclick="window.print()">طباعة</button></div><div class="panel"><table><thead><tr><th>أمر التصنيع</th><th>المنتج</th><th>تكلفة الخامات</th><th>تكاليف إضافية</th><th>الإجمالي</th><th>الإنتاج</th><th>تكلفة الوحدة</th><th>إجراء</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
}
window._addCost=id=>{const po=get("productionOrders",id);openModal("إضافة تكلفة للتصنيع",`<div class="form"><div class="field"><label>أمر التصنيع</label><input value="${esc(po.no)}" disabled></div><div class="field"><label>نوع التكلفة</label><select id="ct"><option>عمالة</option><option>مصروفات صناعية</option><option>أخرى</option></select></div><div class="field"><label>المبلغ</label><input id="ca" type="number" step="0.01"></div><div class="field"><label>بيان</label><input id="cd"></div></div><div class="toolbar"><button class="btn primary" id="sv">حفظ</button></div>`);$("#sv").onclick=()=>{rows("costs").push({id:uid(),productionOrderId:id,type:$("#ct").value,amount:Number($("#ca").value||0),description:$("#cd").value,date:today()});audit("CREATE","COST",id,$("#ct").value);writeState();closeModal();p1Costing()}}
